<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — CoworkWiFi Planner</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>📡 CoworkWiFi Planner</h1>
    <p class="subtitle">Программа проверки зоны покрытия Wi-Fi</p>

    <form id="loginForm">
      <label>Email
        <input type="email" id="email" required placeholder="admin@local">
      </label>
      <label>Пароль
        <input type="password" id="password" required placeholder="••••••">
      </label>
      <button type="submit" class="btn-primary">Войти</button>
    </form>

    <p class="hint">
      Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a>
    </p>

    <form id="registerForm" style="display:none">
      <label>ФИО
        <input type="text" id="regName" required placeholder="Иван Иванов">
      </label>
      <label>Email
        <input type="email" id="regEmail" required placeholder="user@example.com">
      </label>
      <label>Пароль
        <input type="password" id="regPassword" required minlength="6" placeholder="минимум 6 символов">
      </label>
      <label>Роль
        <select id="regRole">
          <option value="analyst">Аналитик</option>
          <option value="engineer">Инженер</option>
          <option value="admin">Администратор</option>
        </select>
      </label>
      <button type="submit" class="btn-primary">Создать аккаунт</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>

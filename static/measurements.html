<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Измерения — CoworkWiFi Planner</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="measurements-page">
<header class="topbar">
  <div class="logo">📡 CoworkWiFi Planner</div>
  <nav>
    <a href="/static/index.html">Главная</a>
    <a href="/static/editor.html">Редактор</a>
    <a href="/static/measurements.html" class="active">Измерения</a>
    <a href="/static/admin.html" id="adminLink" style="display:none">Админ</a>
  </nav>
  <div class="user-info">
    <span id="userName"></span>
    <button id="logoutBtn" class="btn">Выйти</button>
  </div>
</header>

<div class="editor-layout">

  <aside class="editor-side">
    <h3>Проект</h3>
    <select id="projectSelect">
      <option value="">— Выберите —</option>
    </select>

    <h3>Инструмент</h3>
    <button class="tool-btn active" data-tool="select">🖱 Выделение</button>
    <button class="tool-btn" data-tool="measure">📍 Добавить замер</button>

    <h3>Слои</h3>
    <label style="font-size:12px;display:block;margin-bottom:4px">
      <input type="checkbox" id="layerWalls" checked> Стены
    </label>
    <label style="font-size:12px;display:block;margin-bottom:4px">
      <input type="checkbox" id="layerCoverage" checked> Тепловая карта
    </label>

    <h3>Действия</h3>
    <button class="tool-btn" id="showHeatmap">🌊 Пересчитать покрытие</button>
    <button class="tool-btn" id="autoFillBtn">🤖 Автозаполнить замеры</button>
    <button class="tool-btn" id="exportCsvBtn">📄 Экспорт CSV</button>

    <h3>Замеры (<span id="measCount">0</span>)</h3>
    <div id="measList"></div>
  </aside>

  <div class="editor-canvas" id="canvasWrap">
    <div class="canvas-hint" id="canvasHint">Выберите проект</div>

    <svg id="planSvg" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1200 800"
         preserveAspectRatio="xMinYMin meet">
      <defs>
        <pattern id="grid10" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#f4f4f8" stroke-width="0.5"/>
        </pattern>
        <pattern id="grid100" width="40" height="40" patternUnits="userSpaceOnUse">
          <rect width="40" height="40" fill="url(#grid10)"/>
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e4e4ec" stroke-width="0.8"/>
        </pattern>
      </defs>

      <rect x="0" y="0" width="100%" height="100%" fill="#ffffff" pointer-events="none"/>
      <rect x="0" y="0" width="100%" height="100%" fill="url(#grid100)" pointer-events="none" opacity="0.6"/>

      <g id="layerWalls" pointer-events="none"></g>
      <g id="layerDraft" pointer-events="none"></g>
      <g id="layerMeasurements"></g>
    </svg>

    <canvas id="heatmapCanvas"></canvas>

    <div class="legend">
      <div class="legend-title">RSSI, дБм</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#00b894"></div> Отлично (&gt; −55)</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#a0dc78"></div> Хорошо (−55…−65)</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#fdcb6e"></div> Норма (−65…−72)</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#ff9f40"></div> Слабо (−72…−80)</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#ff6b6b"></div> Плохо (&lt; −80)</div>
    </div>

    <div class="zoom-bar">
      <button id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn">+</button>
    </div>
  </div>

  <aside class="editor-props" id="propsPanel">
    <div class="props-empty">
      <div class="big">📍</div>
      <div>Выберите замер или добавьте новый</div>
    </div>
  </aside>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/measurements.js"></script>
</body>
</html>

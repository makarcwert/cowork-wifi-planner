<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тепловые карты</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">📡 CoworkWiFi Planner</div>
  <nav>
    <a href="/static/index.html">Главная</a>
    <a href="/static/editor.html">Редактор</a>
    <a href="/static/measurements.html">Измерения</a>
    <a href="/static/heatmap.html" class="active">Тепловые карты</a>
    <a href="/static/admin.html" id="adminLink" style="display:none">Админ</a>
  </nav>
  <div class="user-info"><span id="userName"></span></div>
</header>
<main class="container">
  <h1>Тепловые карты</h1>
  <p>API: <code>POST /api/heatmaps/plan/{id}</code> с телом <code>{"layer_type":"rssi","resolution":20}</code></p>
  <p>Результат: JSON-сетка для отрисовки на Canvas.</p>
</main>
<script src="/static/js/api.js"></script>
<script>
  API.get('/api/auth/me').then(function (u) {
    document.getElementById('userName').textContent = u.full_name;
    if (u.role === 'admin') document.getElementById('adminLink').style.display = '';
  });
</script>
</body>
</html>
